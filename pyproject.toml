[project]
name = "autonomous-sg-coordinator"
version = "0.1.0"
description = "Bounded multi-agent airport coordination prototype"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.12,<3", "httpx>=0.28,<1", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
